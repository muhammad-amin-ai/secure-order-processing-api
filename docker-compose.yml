version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order_api
      POSTGRES_PASSWORD: order_api_password
      POSTGRES_DB: order_api
    ports:
      - "5432:5432"
    volumes:
      - order_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://order_api:order_api_password@db:5432/order_api
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  order_api_pgdata:
